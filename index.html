<html lang="zh-Hant">
<head>

<title>I POWER 神剪輯</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cdefs%3E%0A%20%20%3ClinearGradient%20id%3D%22brand-gradient%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%20gradientUnits%3D%22objectBoundingBox%22%3E%0A%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235b86ff%22/%3E%0A%20%20%20%20%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23a05bff%22/%3E%0A%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff5fa2%22/%3E%0A%20%20%3C/linearGradient%3E%0A%20%20%3CradialGradient%20id%3D%22brand-light%22%20cx%3D%22.12%22%20cy%3D%220%22%20r%3D%22.87%22%3E%0A%20%20%20%20%3Cstop%20stop-color%3D%22%23e4e8ff%22%20stop-opacity%3D%22.34%22/%3E%0A%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23e4e8ff%22%20stop-opacity%3D%220%22/%3E%0A%20%20%3C/radialGradient%3E%0A%3C/defs%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22url%28%23brand-gradient%29%22/%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22url%28%23brand-light%29%22/%3E%3Cg%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M4%204h7L8%207v13H4Z%22/%3E%3Cpath%20fill%3D%22%23f4edff%22%20fill-rule%3D%22evenodd%22%20d%3D%22M13%204h4l4%204v4l-4%204h-3v4h-4V7Zm1%204v4h2l1-1V9l-1-1Z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IP神剪">
<meta name="theme-color" content="#14161f">
<style>
:root{--bg:#14161f;--panel:#1d2030;--panel2:#262a3d;--line:#343a55;--text:#eef1ff;--sub:#99a2c8;--main:#5b86ff;--hot:#ff9f43;--ok:#2ec27e;--err:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
#app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--panel)}
.top b{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{background:linear-gradient(135deg,#5b86ff,#a05bff);color:#fff;font-weight:900;font-size:13px;padding:4px 7px;border-radius:8px;letter-spacing:1px;white-space:nowrap}
.top a{color:var(--sub);font-size:20px;text-decoration:none;white-space:nowrap;padding:0 2px}
.top select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
.top .exp{background:var(--main);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.stage{touch-action:none;flex:1;min-height:120px;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:15px;padding:20px;pointer-events:none;line-height:1.7}
.transport{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel)}
.transport button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;min-width:44px}
.transport .play{background:var(--main);border-color:var(--main);font-size:18px;min-width:56px}
.transport .time{flex:1;text-align:center;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.transport .time b{color:var(--text);font-size:15px}
.tl{min-height:236px;position:relative;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#scroller{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
#inner{position:relative;padding-bottom:6px}
.ruler{position:relative;height:20px}
.ruler i{position:absolute;top:0;font-style:normal;font-size:10px;color:var(--sub);border-left:1px solid var(--line);padding-left:3px;height:20px;line-height:18px;white-space:nowrap}
.row{position:relative;margin-top:4px}
.row.v{height:78px}
.clip{position:absolute;top:0;height:50px;border-radius:8px;overflow:hidden;background:#3a4166 center/auto 100% repeat-x;border:2px solid #4a5284;color:#fff;font-size:11px}
.clip.active{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot)}
.clip span{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;background:rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.mute::after{content:"🔇";position:absolute;right:3px;top:2px;font-size:12px}
.tblock,.mblock{position:absolute;height:24px;border-radius:6px;font-size:12px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tblock{background:#7a52d6;border:2px solid #7a52d6}
.tblock.sel{border-color:var(--hot)}
.mblock{background:#1f8f6a;border:2px solid #1f8f6a}
.mblock.sel{border-color:var(--hot)}
.vblock{background:#b8467a;border:2px solid #b8467a}
.ruler b.bt{position:absolute;top:8px;width:3px;height:12px;background:#ffb347;border-radius:2px;margin-left:-1px}
.playhead{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;margin-left:-1px;pointer-events:none;z-index:3;box-shadow:0 0 4px rgba(0,0,0,.6)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#fff}
.tlb{position:absolute;top:24px;z-index:4;width:42px;height:46px;border-radius:12px;border:1px solid var(--line);background:#1d2030ee;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
.tlb.add{right:6px;background:var(--main);border-color:var(--main);font-size:28px;font-weight:700}
.tlb.vol{left:6px}
#volp{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:744px;margin:0 auto;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:none;box-shadow:0 -6px 24px #000a}
#volp label{display:block;font-size:13px;color:var(--sub);margin:8px 0 2px}#volp label b{color:var(--text);margin-left:6px}
#volp input[type=range]{width:100%;height:30px}
.quick{display:flex;gap:8px;padding:4px 8px;background:var(--bg)}
.quick button{flex:1;background:var(--panel2);color:var(--text);border:1px dashed var(--line);border-radius:9px;padding:6px 4px;font-size:13px;font-weight:700}
.quick button:active{background:var(--line)}
/* toolbar 改為大分類（見後面 .toolbar） */
.toolbar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;min-width:50px;background:transparent;border:0;color:var(--text);padding:3px 4px;border-radius:10px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tb i{font-style:normal;font-size:17px;line-height:1}
.tb:active{background:var(--panel2)}
.tb:disabled{opacity:.35}
.ctx{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;z-index:57;display:none;background:var(--panel);padding:12px 14px calc(14px + env(safe-area-inset-bottom));max-height:42vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px #000c;font-size:14px;animation:shup .18s ease-out}
.ctx.edit{max-height:42vh}
@keyframes shup{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sh-x{position:sticky;top:0;float:right;z-index:3;width:40px;height:40px;border-radius:50%;background:var(--main);color:#fff;border:0;font-size:20px;margin:0 0 4px 8px}
#cats{overflow-y:auto;position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;z-index:57;display:none;background:var(--panel);padding:12px 12px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -10px 30px #000c;animation:shup .18s ease-out}
#cats.on{display:block}
#cats .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}#cats .hd b{font-size:15px}
#cats-x{width:40px;height:40px;border-radius:50%;background:var(--main);color:#fff;border:0;font-size:20px}
#cats-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
#cats-g .tb{min-width:0;width:100%;background:var(--panel2);border-radius:14px;padding:12px 2px 9px;font-size:12px;gap:5px}
#cats-g .tb i{font-size:24px}
#lower{position:relative;z-index:5;background:var(--bg);transition:transform .18s ease-out}
.cat{flex:1;background:var(--panel2);border:0;color:var(--text);border-radius:14px;padding:9px 2px 7px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.cat i{font-style:normal;font-size:22px;line-height:1}.cat:active{background:var(--line)}
.zb{position:absolute;top:1px;right:6px;z-index:4;display:flex;gap:4px}
.zb button{width:30px;height:20px;border-radius:6px;border:1px solid var(--line);background:#1d2030ee;color:#fff;font-size:13px;line-height:1;padding:0}
.transport .tb{min-width:38px;font-size:19px;padding:6px 4px;flex-direction:row}
.transport .time{text-align:left;flex:1;white-space:nowrap;font-size:12px;min-width:0}.transport .time b{font-size:13px}
#b-full{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700;min-width:40px}
#app.full .top,#app.full .tl,#app.full .toolbar,#app.full .quick,#app.full #ctx,#app.full #cats{display:none!important}
#app.full #lower{transform:none!important}
#app.full .transport .tb,#app.full #b-prev,#app.full #b-next{display:none}
#app.full .transport{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.quick{display:none!important}
.toolbar{display:flex;gap:8px;padding:8px 10px;background:var(--panel)}

.ctx h4{margin:4px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.ctx label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.ctx input[type=number],.ctx input[type=text],.ctx textarea,.ctx select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px;font-family:inherit}
.ctx textarea{min-height:54px;resize:vertical}
.ctx input[type=range]{width:100%;height:30px}
.ctx .r2{display:flex;gap:8px}.ctx .r2>*{flex:1}
.ctx .sm{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font-size:13px;font-weight:700}
.ctx .sm.red{color:var(--err);border-color:#6b3a46}
.ctx .sm.ok{background:var(--main);border-color:var(--main)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--text);font-size:14px}
.hint{font-size:12px;color:var(--sub);margin:4px 0}
.tmark{position:absolute;top:52px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#262a3d;border:2px solid #fff;color:#fff;font-size:13px;line-height:22px;text-align:center;z-index:30;box-shadow:0 1px 4px #0008}
.tmark.on{background:var(--hot);border-color:var(--hot);color:#000;font-weight:800}
.tmark.sel{box-shadow:0 0 0 3px #fff8}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.fchips .sm{flex:0 0 auto;min-width:58px}
.ctx label b{color:var(--text);font-weight:700;margin-left:6px}
.lblock{position:absolute;height:24px;border-radius:6px;font-size:12px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#d6527a;border:2px solid #d6527a}
.lblock.sel{border-color:var(--hot)}
.trkbg{position:absolute;left:0;height:52px;background:rgba(255,255,255,.05);border-radius:6px}
.trklbl,.trkdel,.trkadd{position:sticky;left:4px;z-index:6;display:inline-block;height:22px;line-height:20px;margin-top:2px;padding:0 9px;border-radius:11px;background:#262a3d;border:1px solid #8485c4;color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.trkdel{left:auto;margin-left:4px;padding:0 7px;color:#ffb3b3;border-color:#6b3a46}
.trkadd{left:4px;height:24px;line-height:22px;margin:2px 0;background:#3a3470;border-color:#8485c4}
#row-ladd{height:28px}
#trkov{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:5}
#trkov .tlb{position:absolute;top:auto;width:38px;height:44px;font-size:18px;pointer-events:auto}
#trkov .tlb.add{right:6px;font-size:26px}#trkov .tlb.vol{left:6px}
#trkov .trkx{position:absolute;left:50px;width:30px;height:22px;border-radius:11px;background:#262a3d;border:1px solid #6b3a46;color:#ffb3b3;font-size:12px;font-weight:700;pointer-events:auto;padding:0}
#row-l .lblock.sel{touch-action:none}
#row-l .lblock .hd{position:absolute;top:0;bottom:0;width:22px;background:rgba(255,179,71,.92);display:flex;align-items:center;justify-content:center;color:#2b1a00;font-weight:900;font-size:14px;touch-action:none;z-index:2}
#row-l .lblock .hd.l{left:0;border-radius:6px 0 0 6px}#row-l .lblock .hd.r{right:0;border-radius:0 6px 6px 0}
#row-l .lblock{height:50px;padding:0;line-height:normal;border-radius:8px;border:2px solid #4a5284;background:#3a4166 center/auto 100% repeat-x;overflow:hidden;font-size:11px}
#row-l .lblock.sel{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot)}
#row-l .lblock span{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;background:rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.tplb{flex:0 0 auto;width:62px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:6px 4px 4px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.tplb svg{width:30px;height:40px}
.tplb svg rect{fill:#5b86ff55;stroke:#8fb0ff;stroke-width:.8}
.tabs4{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.tabs4 .sm{padding:9px 0;font-size:11.5px}
.trg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trg .sm{padding:10px 4px}
#home{position:fixed;inset:0;z-index:60;background:#07070d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;text-align:center;overflow:hidden;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#home.off{display:none}
#home .bl{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform;pointer-events:none}
#home .b1{width:300px;height:300px;background:#8b5cff;top:-90px;left:-80px;animation:fl1 14s ease-in-out infinite alternate}
#home .b2{width:260px;height:260px;background:#ff4f9a;top:30%;right:-110px;animation:fl2 17s ease-in-out infinite alternate}
#home .b3{width:280px;height:280px;background:#25c7ff;bottom:-110px;left:-60px;opacity:.4;animation:fl3 16s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(70px,90px) scale(1.15)}}
@keyframes fl2{to{transform:translate(-80px,-60px) scale(1.2)}}
@keyframes fl3{to{transform:translate(90px,-70px) scale(1.1)}}
#home>*:not(.bl){position:relative;z-index:1;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#home .hlogo{background:linear-gradient(135deg,#5b86ff,#a05bff 55%,#ff5fa2);color:#fff;font-weight:900;font-size:26px;padding:12px 18px;border-radius:22px;letter-spacing:2px;line-height:1.15;box-shadow:0 10px 36px #a05bff88,inset 0 1px 0 #ffffff66;transform:rotate(-6deg)}
#home h1{margin:18px 0 10px;font-size:27px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#fff 20%,#d9c8ff 55%,#8fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#home .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#home .chips span{font-size:12px;font-weight:700;color:#e9e4ff;padding:5px 11px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;backdrop-filter:blur(6px)}
#home .hbtn{display:block;width:100%;max-width:360px;border:0;font-family:inherit;font-weight:900;color:#fff}
#home #h-start{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin-top:26px;padding:14px 18px 14px 14px;border-radius:99px;font-size:21px;letter-spacing:2px;text-align:left;background:linear-gradient(110deg,#6d5cff 0%,#b44dff 55%,#ff3fb4 100%);background-size:200% 200%;animation:up .6s both,gs 7s ease infinite;box-shadow:0 12px 34px #b44dff66,inset 0 1px 0 #ffffff66}
@keyframes gs{50%{background-position:100% 50%}}
#home #h-start::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff44,transparent);transform:skewX(-20deg);animation:sh 4.5s ease-in-out infinite}
@keyframes sh{0%,60%{left:-60%}100%{left:130%}}
#home #h-start .pl{flex:none;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 12px #0004}
#home #h-start .pl svg{width:28px;height:28px;stroke:#8a3dff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#home #h-start .lb{flex:1}
#home #h-start .ar{flex:none;font-size:30px;line-height:1;opacity:.9;margin-right:4px}
#home #h-start:active{transform:scale(.97)}
#home .hbtn.sub{margin-top:12px;padding:14px 10px;font-size:16px;background:#ffffff12;border:1px solid #ffffff22;border-radius:18px}
#home .hbox{width:100%;max-width:360px;margin-top:24px;text-align:left}
#home .hbox .ht{font-size:15px;color:#fff;margin:0 4px 12px;font-weight:800;letter-spacing:1px;opacity:.9}
#home .hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#home .tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:#d9d9e3;padding:0;font-size:13px;font-weight:700;text-decoration:none;font-family:inherit;-webkit-tap-highlight-color:transparent}
#home .tile i{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:22px;background:linear-gradient(160deg,#ffffff1c,#ffffff08);border:1px solid #ffffff1f;color:#fff;backdrop-filter:blur(12px);box-shadow:0 8px 18px #0007,inset 0 1px 0 #ffffff26;transition:transform .15s,background .15s}
#home .tile i svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#home .tile:active i{transform:scale(.9);background:linear-gradient(160deg,#a67bff55,#ff4f9a33)}
#home .tile:disabled{opacity:.6}
#home .hgrid{row-gap:20px}
#home .hfoot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;font-size:11px;color:#ffffff80;animation:none}
@media (prefers-reduced-motion:reduce){#home *{animation:none!important}}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:90;background:#ff9f43;color:#2a1300;font-weight:800;font-size:15px;padding:12px 14px;border-radius:14px;text-align:center;box-shadow:0 6px 20px #000a;display:none}

<div class="toast" id="toast"></div>

<div id="pj"><div class="box">
  <h3>我的專案</h3>
  <label>目前這個作品的名稱</label><input type="text" id="pj-name" maxlength="30" placeholder="例如：社團成果影片">
  <button class="bigbtn" id="pj-save">儲存專案</button>
  <button class="bigbtn x" id="pj-new">＋ 新增空白專案</button>
  <label>已暫存的專案</label><div id="pj-list"></div>
  <p class="hint" id="pj-st" style="font-size:12px;color:var(--sub)"></p>
  <button class="bigbtn x" id="pj-close">關閉</button>
</div></div>

<div id="xp"><div class="box">
  <h3>匯出作品</h3>
  <div id="xp-opts">
    <label>輸出種類</label>
    <select id="xp-fmt"><option value="mp4">影片（MP4）</option><option value="mp3">音訊（MP3）</option></select>
    <label id="xp-ql-l">畫質</label>
    <select id="xp-q"><option value="480">省空間（480p，傳 LINE 用）</option><option value="720" selected>一般（720p，建議）</option><option value="1080">高畫質（1080p，最慢）</option></select>
    <label id="xp-mode-l">匯出方式</label>
    <select id="xp-mode"><option value="fast">快速（硬體加速，預設）</option><option value="compat">相容（較慢）</option></select>
    <p class="hint" id="xp-note"></p>
    <button class="bigbtn" id="xp-go">開始匯出</button>
  </div>
  <div class="bar"><i></i></div><div class="st" id="xp-st"></div>
  <div id="xp-res"></div>
  <button class="bigbtn x" id="xp-close">關閉</button>
</div></div>

<script src="lib/ffmpeg.js"></script>
<script src="lib/util.js"></script>
<script>
const $ = s => document.querySelector(s);
const fetchFile = (...args) => window.FFmpegUtil.fetchFile(...args);

/* ================= 資料 ================= */
const assets = new Map();           // id -> {id,kind,file,url,el,img,w,h,dur,name,thumb}
let uid = 1;
let state = { ratio: '9:16', clips: [], layers: [], texts: [], music: null, kb: false, vol: { video: 1, music: 0.6 } };
let history = [], redoStack = [], lastTouch = null;
let showClip = false, showAu = false, showSt = false, showEf = false, showKf = false, kfMode = 'clip', kfLyId = null, kfIdx = -1;
let showFx = false, fxTab = 'f', fxIdx = -1, showLy = false, selLy = null, lyTab = 'p', pendingTpl = null;
let cur = 0, playing = false, pps = 80, selText = null, selMusic = false, selTr = null, showAuto = false, dirty = true;
let selPic = null;   // 目前「鎖定」可以在畫面上拖移／縮放／旋轉的那一段（clip id）
let lyPick = false;   // 點選第2軌（畫面軌道）的素材＝只選取、不跳選單（和主軌一樣）；要開版位等細項再按下面的工具
const lyOn = () => !!(selLy && (showLy || lyPick));
const tvOf = t => (state.tv && state.tv[t] != null) ? state.tv[t] : 1;   // 每一條畫面軌道自己的音量
function clearSel() { lyPick = false; selPic = null; showClip = false; showAu = false; showSt = false; showEf = false; showKf = false; showLy = false; selLy = null; showFx = false; selText = null; selMusic = false; selTr = null; showAuto = false; }
let L = [], total = 0;               // 排版結果
const FXP = {
  none: { n: '原圖', b: 0, ct: 1, sa: 1, r: 1, g: 1, bl: 1 },
  vintage: { n: '復古', b: .02, ct: 1.05, sa: .75, r: 1.08, g: 1, bl: .85 },
  cinema: { n: '電影', b: -.03, ct: 1.2, sa: .9, r: 1.06, g: 1, bl: .94 },
  japan: { n: '日系', b: .08, ct: .9, sa: .85, r: 1, g: 1.03, bl: 1.06 },
  bw: { n: '黑白', b: 0, ct: 1.15, sa: 0, r: 1, g: 1, bl: 1 },
  vivid: { n: '鮮豔', b: 0, ct: 1.1, sa: 1.5, r: 1, g: 1, bl: 1 },
  cool: { n: '冷調', b: 0, ct: 1, sa: 1, r: .92, g: 1, bl: 1.1 },
  warm: { n: '暖調', b: 0, ct: 1, sa: 1, r: 1.1, g: 1.02, bl: .9 }
};
const fxP = c => { const p = FXP[c.fp] || FXP.none; return { b: p.b + (c.fb || 0), ct: p.ct * (c.fc == null ? 1 : c.fc), sa: p.sa * (c.fs == null ? 1 : c.fs), r: p.r, g: p.g, bl: p.bl }; };
const hasFx = c => { const q = fxP(c); return Math.abs(q.b) > .001 || Math.abs(q.ct - 1) > .001 || Math.abs(q.sa - 1) > .001 || q.r !== 1 || q.g !== 1 || q.bl !== 1; };
const spd = c => c.sp || 1;
const RATIO = { '9:16': [360, 640], '16:9': [640, 360], '1:1': [480, 480], '4:3': [640, 480], '3:4': [480, 640] };

const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

function commit() { history.push(JSON.stringify(state)); if (history.length > 60) history.shift(); redoStack = []; lastTouch = null; }
function touch(kind) { if (lastTouch !== kind) { commit(); lastTouch = kind; } }
function restore(s) {
  state = JSON.parse(s); selTr = null; showAuto = false;
  if (selText && !state.texts.find(t => t.id === selText)) selText = null;
  if (state.music && !assets.get(state.music.asset)) state.music = null;
  if (!state.music) selMusic = false;
  $('#ratio').value = state.ratio; applyRatio(); relayout(); renderAll();
}
function undo() { if (!history.length) return toast('沒有可以復原的了'); redoStack.push(JSON.stringify(state)); restore(history.pop()); lastTouch = null; }
function redo() { if (!redoStack.length) return toast('沒有可以重做的了'); history.push(JSON.stringify(state)); restore(redoStack.pop()); lastTouch = null; }

/* ================= 版面計算 ================= */
function normLy() {   // 畫面軌道：每一層放在哪一條軌道（trk）。軌道越高越在上面；舊作品沒有軌道就照以前的自動分層補上
  const ls = state.layers || []; if (!ls.length && !state.ntrk) return;
  const ends = [];
  ls.forEach(l => { if (l.trk == null) { let k = ends.findIndex(e => e <= l.start + 0.001); if (k < 0) { k = ends.length; ends.push(0); } ends[k] = l.start + l.len; l.trk = k; } });
  let mx = -1; ls.forEach(l => { if (l.trk > mx) mx = l.trk; });
  state.ntrk = Math.max(state.ntrk || 0, mx + 1);
  if (ls.some((l, i) => i && ls[i - 1].trk > l.trk)) state.layers = ls.map((l, i) => [l, i]).sort((a, b) => a[0].trk - b[0].trk || a[1] - b[1]).map(x => x[0]);
}
function relayout() {
  normLy(); L = [];
  state.clips.forEach((c, i) => {
    const d = (c.out - c.in) / spd(c); let td = 0;
    if (i > 0 && c.tr) { td = Math.min(c.tr.dur, 0.45 * Math.min(L[i - 1].d, d)); td = Math.round(td * 30) / 30; if (td < 0.2) td = 0; }
    const start = i ? L[i - 1].end - td : 0;
    L.push({ c, i, start, end: start + d, d, td });
  });
  const mainEnd = L.length ? L[L.length - 1].end : 0, lyEnd = (state.layers || []).reduce((m, l) => Math.max(m, l.start + l.len), 0);
  total = Math.max(mainEnd, lyEnd); cur = clamp(cur, 0, total);
}
function clipAt(t) {
  if (!L.length) return null;
  for (let k = L.length - 1; k >= 0; k--) if (t >= L[k].start && t < L[k].end) return L[k];
  return L[L.length - 1];
}

/* ===== 直接拍攝＋倒數計時 ===== */
let camS = null;
function camClose() { if (!camS) return; try { if (camS.mr && camS.mr.state !== 'inactive') { camS.mr.onstop = null; camS.mr.stop(); } } catch (er) {} clearInterval(camS.tm); clearTimeout(camS.cd); if (camS.stream) camS.stream.getTracks().forEach(t => t.stop()); camS.box.remove(); camS = null; }
async function camStart(face) {
  if (camS.stream) camS.stream.getTracks().forEach(t => t.stop());
  try { camS.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: true }); }
  catch (e) { try { camS.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face }, audio: false }); toast('沒有取得麥克風，這支影片會沒有聲音'); } catch (e2) { toast('沒有取得相機權限，請在瀏覽器允許使用相機'); camClose(); return; } }
  camS.face = face; const v = camS.box.querySelector('video'); v.srcObject = camS.stream; v.style.transform = face === 'user' ? 'scaleX(-1)' : 'none'; v.play().catch(() => {});
}
async function camOpen() {
  if (camS) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') return toast('這個瀏覽器不支援直接拍攝，請用時間軸右邊的「＋」選相機拍好的影片');
  const box = document.createElement('div');
  box.setAttribute('data-ip-camera', '');
  box.style.cssText = 'position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:space-between';
  box.innerHTML = `<div style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-size:15px"><button id="cm-x" style="background:#0008;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-size:15px">✕ 取消</button><b id="cm-t">準備拍攝</b><button id="cm-f" style="background:#0008;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-size:15px">🔄 翻轉</button></div>
  <div style="flex:1;width:100%;position:relative;min-height:0"><video playsinline muted style="width:100%;height:100%;object-fit:contain;background:#000"></video><div id="cm-n" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;font-weight:800;color:#fff;text-shadow:0 0 20px #000"></div></div>
  <div style="padding:14px;display:flex;align-items:center;gap:22px;color:#fff;font-size:14px"><label style="display:flex;flex-direction:column;align-items:center;gap:4px">倒數<select id="cm-c" style="font-size:15px;padding:4px"><option value="0">不倒數</option><option value="3" selected>3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></label>
  <button id="cm-r" style="width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#e33;color:#fff;font-size:15px;font-weight:700">拍攝</button><span style="width:70px"></span></div>`;
  document.body.appendChild(box); camS = { box, stream: null, mr: null, face: 'environment' };
  const q = id => box.querySelector(id);
  q('#cm-x').onclick = camClose;
  q('#cm-f').onclick = () => { if (camS.mr || camS.cd) return toast('拍攝中不能翻轉'); camStart(camS.face === 'user' ? 'environment' : 'user'); };
  q('#cm-r').onclick = () => {
    if (camS.mr) return camStop();
    if (camS.cd) { clearTimeout(camS.cd); camS.cd = null; q('#cm-n').style.display = 'none'; q('#cm-r').textContent = '拍攝'; q('#cm-t').textContent = '準備拍攝'; return; }
    let n = +q('#cm-c').value; q('#cm-r').textContent = '取消';
    const step = () => { if (n <= 0) { q('#cm-n').style.display = 'none'; camS.cd = null; return camRec(); } q('#cm-n').style.display = 'flex'; q('#cm-n').textContent = n; q('#cm-t').textContent = '倒數中…'; n--; camS.cd = setTimeout(step, 1000); };
    step();
  };
  await camStart('environment');
}
function camRec() {
  const st = camS.stream, q = id => camS.box.querySelector(id);
  const mt = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '', chunks = [];
  let mr; try { mr = new MediaRecorder(st, mt ? { mimeType: mt } : undefined); } catch (e) { toast('這支手機無法錄影'); return camClose(); }
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => camDone(chunks, mr.mimeType || mt || 'video/webm');
  camS.mr = mr; camS.t0 = Date.now(); mr.start(500);
  q('#cm-r').textContent = '停止'; q('#cm-x').style.visibility = 'hidden'; q('#cm-f').style.visibility = 'hidden';
  camS.tm = setInterval(() => { const sec = Math.floor((Date.now() - camS.t0) / 1000); q('#cm-t').textContent = '🔴 錄影中 ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); if (sec >= 300) camStop(); }, 300);
}
function camStop() { if (camS && camS.mr && camS.mr.state !== 'inactive') camS.mr.stop(); }
async function camDone(chunks, type) {
  const isMp4 = /mp4/.test(type), n = 1 + [...assets.values()].filter(a => /^拍攝/.test(a.name)).length;
  let blob = new Blob(chunks, { type: isMp4 ? 'video/mp4' : 'video/webm' });
  const box = camS && camS.box; if (box) { box.querySelector('#cm-t').textContent = '處理中…'; box.querySelector('#cm-r').style.display = 'none'; }
  let file = new File([blob], `拍攝${n}.${isMp4 ? 'mp4' : 'webm'}`, { type: blob.type });
  if (!isMp4) {   // webm 沒有影片長度資訊，用 ffmpeg 重新封裝（不重新壓縮，很快）補上
    try { const f = await getFF(); await f.writeFile('cam_in.webm', await fetchFile(file)); const rc = await f.exec(['-i', 'cam_in.webm', '-c', 'copy', '-y', 'cam_out.webm']); if (rc === 0) { const d = await f.readFile('cam_out.webm'); file = new File([d], file.name, { type: 'video/webm' }); } try { await f.deleteFile('cam_in.webm'); await f.deleteFile('cam_out.webm'); } catch (er) {} } catch (er) { console.error(er); }
  }
  camClose(); await addMedia([file]); if (window.__hideHome) window.__hideHome(); toast('拍好了，已加入時間軸');
}
/* ================= 匯入素材 ================= */
function loadVideo(a) {
  return new Promise((res, rej) => {
    const el = document.createElement('video'); let done = false, t1, t2;
    const fail = msg => { if (done) return; done = true; clearTimeout(t1); clearTimeout(t2); try { el.removeAttribute('src'); el.load(); el.remove(); } catch (e) {} rej(new Error(msg)); };
    const ok = () => { if (done) return; done = true; clearTimeout(t1); clearTimeout(t2); el.onseeked = null; el.addEventListener('seeked', () => dirty = true); res(); };
    el.playsInline = true; el.preload = 'auto'; el.src = a.url; el.setAttribute('playsinline', '');
    $('#pool').appendChild(el);
    el.addEventListener('seeked', () => dirty = true); el.addEventListener('loadeddata', () => dirty = true);
    el.onerror = () => fail('「' + a.name + '」這支影片格式讀不了（可能是 HEVC/H.265 或損壞），請改用 MP4(H.264) 的影片');
    t1 = setTimeout(() => fail('「' + a.name + '」讀取太久沒有回應，已跳過（檔案太大或格式不支援）'), 25000);
    el.onloadedmetadata = () => {
      if (!isFinite(el.duration) || !el.videoWidth) return fail('「' + a.name + '」讀不到影片長度或畫面，已跳過');
      a.el = el; a.w = el.videoWidth; a.h = el.videoHeight; a.dur = el.duration;
      t2 = setTimeout(ok, 5000);   // 取縮圖等太久就不等了，照樣匯入
      el.onseeked = () => {
        try { const c = document.createElement('canvas'); c.height = 80; c.width = Math.round(80 * a.w / a.h) || 80;
          c.getContext('2d').drawImage(el, 0, 0, c.width, c.height); a.thumb = c.toDataURL('image/jpeg', 0.6); } catch (e) {}
        ok();
      };
      try { el.currentTime = Math.min(0.1, el.duration / 2); } catch (e) { ok(); }
    };
  });
}
function loadImage(a) {
  return new Promise((res, rej) => {
    const img = new Image(); let done = false;
    const t = setTimeout(() => { if (!done) { done = true; rej(new Error('「' + a.name + '」照片讀取太久沒有回應，已跳過')); } }, 20000);
    img.onload = () => { if (done) return; done = true; clearTimeout(t); a.img = img; a.w = img.naturalWidth; a.h = img.naturalHeight; a.thumb = a.url; res(); };
    img.onerror = () => { if (done) return; done = true; clearTimeout(t); rej(new Error('「' + a.name + '」這張照片讀不了（HEIC 之類的格式請先轉成 JPG）')); }; img.src = a.url;
  });
}
async function makeAsset(file) {
  const a = { id: uid++, file, url: URL.createObjectURL(file), name: file.name, kind: file.type.startsWith('image/') ? 'image' : file.type.startsWith('audio/') ? 'audio' : 'video' };
  try { if (a.kind === 'video') await loadVideo(a); else if (a.kind === 'image') await loadImage(a); }
  catch (e) { URL.revokeObjectURL(a.url); throw e; }
  assets.set(a.id, a); return a;
}
async function addMedia(files) {
  commit(); const n = files.length, res = new Array(n), errs = []; let next = 0, fin = 0;
  const show = () => toast('匯入中 ' + fin + ' / ' + n + '…');
  show();
  const worker = async () => {   // 同時處理 2 個，順序仍照選的順序
    while (next < n) {
      const i = next++, f = files[i];
      try { res[i] = await makeAsset(f); } catch (e) { errs.push(e.message); }
      fin++; show();
    }
  };
  await Promise.all([worker(), worker()]);
  let okN = 0;
  for (const a of res) if (a) { state.clips.push({ id: uid++, asset: a.id, in: 0, out: a.kind === 'image' ? 3 : a.dur, mute: false }); okN++; }
  relayout(); renderAll();
  if (errs.length) { toast('成功 ' + okN + ' 個，失敗 ' + errs.length + ' 個：' + errs[0] + (errs.length > 1 ? '（還有 ' + (errs.length - 1) + ' 個失敗）' : '')); if (!okN) { try { history.pop(); } catch (e) {} } }
  else toast('已加入 ' + okN + ' 個素材');
}
async function addMusic(file) {
  try {
    const a = { id: uid++, file, url: URL.createObjectURL(file), name: file.name, kind: 'audio' };
    const au = new Audio(); au.preload = 'auto'; au.src = a.url;
    await new Promise((res, rej) => { au.onloadedmetadata = res; au.onerror = () => rej(new Error('這個檔案讀不出聲音')); });
    a.el = au; a.dur = au.duration; assets.set(a.id, a);
    commit(); state.music = { asset: a.id, offset: 0 }; clearSel(); selMusic = true;
    relayout(); renderAll(); toast('已加入配樂');
  } catch (e) { toast(e.message); }
}

/* ================= 預覽引擎 ================= */
const cv = $('#cv'), g = cv.getContext('2d');
let pvK = 1, pvIdle = 0;   // 預覽清晰度：播放中用小畫布（順暢），暫停一下就用 2 倍畫布重畫（清楚）
function applyRatio() { const [w, h] = RATIO[state.ratio]; cv.width = w * pvK; cv.height = h * pvK; dirty = true; }
function pvAuto(now) {
  if (exporting || xsrc) return;
  if (playing) { pvIdle = 0; if (pvK !== 1) { pvK = 1; applyRatio(); } return; }
  if (!pvIdle) pvIdle = now;
  if (pvK !== 2 && now - pvIdle > 300) { pvK = 2; applyRatio(); }
}
const textAnc = {}, textAncEx = {};
function drawText(g, W, H, x, tl) {
  const fs = Math.round(H * x.size / 100);
  g.font = `700 ${fs}px "PingFang TC","Noto Sans TC","Microsoft JhengHei","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  const lines = [];
  for (const para of x.text.split('\n')) {
    let c = '';
    for (const ch of para) { if (g.measureText(c + ch).width > W * 0.9 && c) { lines.push(c); c = ch; } else c += ch; }
    lines.push(c);
  }
  const lh = fs * 1.25, tot = lh * lines.length, cx = W / 2 + (x.tx || 0) * W;
  const y0 = (x.pos === 'top' ? H * 0.07 + lh / 2 : x.pos === 'middle' ? (H - tot) / 2 + lh / 2 : H * 0.93 - tot + lh / 2) + (x.ty || 0) * H, cy = y0 + (lines.length - 1) * lh / 2;
  textAnc[x.id] = { cx, cy };
  let al = 1, sc = 1, dy = 0;
  if (x.an && tl != null) { const p = Math.min(1, Math.max(0, tl / 0.35)); if (x.an === 'fade') al = p * Math.min(1, Math.max(0, (x.dur - tl) / 0.35)); else if (x.an === 'pop') { sc = 0.3 + 0.7 * p; al = p; } else if (x.an === 'rise') { dy = (1 - p) * H * 0.05; al = p; } }
  g.save(); g.globalAlpha *= al; if (dy) g.translate(0, dy); if (sc !== 1) { g.translate(cx, cy); g.scale(sc, sc); g.translate(-cx, -cy); }
  const ow = x.bx ? 0 : (x.ow == null ? 1 : x.ow);

  const prog = (pct, msg) => { body.innerHTML = `<div class="qbig"><div class="em">🎬</div><h2>正在幫你做影片…</h2><div class="qbar"><i style="width:${Math.round(pct)}%"></i></div><p class="qh" id="q-msg">${msg}</p><p class="qh">請先不要離開這個畫面，手機也別鎖屏喔。</p></div>`; };
  const setProg = (pct, msg) => { const i = body.querySelector('.qbar i'), m = document.getElementById('q-msg'); if (i) i.style.width = Math.round(pct) + '%'; if (m) m.textContent = msg; };
  async function generate() {
    if (state.clips.length || state.layers.length) { if (!(await pjAskSave())) return; }
    stopPv(); Q.busy = true; render(); prog(2, '準備中…');
    const T = QSTY[Q.sty], D = Q.len; let wake = null; try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
    try {
      pjReset(); state = { ratio: Q.ratio, clips: [], layers: [], texts: [], music: null, kb: false, vol: { video: 1, music: 0.6 } }; uid = 1; PJ.cur = null; PJ.name = ''; PJ.savedStr = ''; PJ.stored = new Set(); $('#ratio').value = state.ratio; applyRatio(); relayout(); renderAll();
      // 1. 匯入
      const items = [], errs = []; let fin = 0;
      for (const f of Q.files) { setProg(3 + 22 * fin / Q.files.length, `匯入素材 ${fin + 1} / ${Q.files.length}…`); try { const a = await makeAsset(f); items.push({ a, cands: null }); } catch (e) { errs.push(e.message); } fin++; }
      if (!items.length) throw new Error(errs[0] || '沒有可以用的素材');
      // 2. 影片找精彩片段
      const vids = items.filter(x => x.a.kind === 'video'); let vi = 0;
      for (const it of items) { if (it.a.kind === 'image') { it.cands = [{ t: 0, score: 1 }]; continue; } setProg(25 + 40 * vi / Math.max(1, vids.length), `正在找精彩片段 ${vi + 1} / ${vids.length}…`); it.cands = await findCands(it.a, T.cap); vi++; }
      // 3. 排版
      setProg(68, '正在排版…');
      let PK = T.pk || null; const cIn = PK && Q.title ? 2.8 : 0, cOut = PK && Q.end ? 2.6 : 0, DM = QDIM[Q.ratio] || QDIM['9:16'], cuts = [];
      const pl = plan(items, PK ? Math.max(4, D - cIn - cOut) : D, T);
      state.clips = pl.map((o, i) => { const c = { id: uid++, asset: o.a.id, in: o.in, out: o.in + o.len, mute: false }; if (i) c.tr = { type: T.tr[(i - 1) % T.tr.length], dur: T.dur }; return c; });
      if (PK) {   // 素材包：片頭卡、片尾卡，中間的換片交替用「遮罩條帶」和「漏光」
        try {
          if (cIn) state.clips.unshift({ id: uid++, asset: (await makeAsset(await cardFile(PK, 'title', DM[0], DM[1]))).id, in: 0, out: cIn, mute: false, card: 1 });
          if (cOut) state.clips.push({ id: uid++, asset: (await makeAsset(await cardFile(PK, 'end', DM[0], DM[1]))).id, in: 0, out: cOut, mute: false, card: 1 });
          state.clips.forEach((c, i) => {
            if (!i) { delete c.tr; return; }
            const pv = state.clips[i - 1];
            if (c.card || pv.card) { c.tr = { type: 'fade', dur: 0.5 }; return; }
            if (i % 2 === 0) { c.tr = { type: 'fade', dur: 0.2 }; cuts.push({ i, t: 'mask' }); } else if (i % 4 === 1) cuts.push({ i, t: 'leak' });
          });
        } catch (e) { PK = null; cuts.length = 0; state.clips = state.clips.filter(c => !c.card); state.clips.forEach((c, i) => { if (i) c.tr = { type: T.tr[(i - 1) % T.tr.length], dur: T.dur }; else delete c.tr; }); toast('素材包沒有載入成功（要連網路），先用一般樣式做'); }
      }
      if (T.kb) state.kb = true;
      relayout();
      // 4. 配樂
      let musicOk = false;
      if (Q.mus !== 'none') {
        setProg(72, '正在準備配樂…');
        try {
          const need = Math.max(D, total) + 1, f = await buildMusic(need, Q.mstyle, Q.mus === 'song' ? Q.song : null);
          await addMusic(f); musicOk = !!state.music; if (musicOk) state.vol = { video: 0.4, music: 0.7 };
        } catch (e) { toast('配樂沒有載入成功（要連網路），影片先做好了'); }
      }
      if (musicOk) {
        setProg(84, '正在對準節拍…'); relayout();
        try { await detectBeats(); } catch (e) {}
        const bt = (state.beats || []).slice().sort((x, y) => x - y);
        if (bt.length) for (let i = 0; i < state.clips.length - 1; i++) {
          relayout(); const e = L[i], c = e.c, a = assets.get(c.asset), sp = spd(c), minEnd = e.start + 1.5, maxEnd = e.start + T.cap * 1.6;
          if (c.card) continue; const cand = bt.filter(t => t >= minEnd && t <= maxEnd).sort((x, y) => Math.abs(x - e.start - T.cap) - Math.abs(y - e.start - T.cap)), b = cand[0]; if (b == null) continue;
          const len = b - e.start; if (a.kind === 'image') c.out = c.in + len; else { const need = c.in + len * sp; if (need <= (a.dur || 1e9)) c.out = need; }
        }
      }
      relayout();
      // 5. 文字與貼紙
      setProg(92, '正在加上文字…');
      const td = Math.min(2.6, Math.max(1, total * 0.2));
      if (PK && Q.title) state.texts.push({ id: uid++, tpl: 1, text: Q.title, start: 0.3, dur: cIn - 0.6, color: T.tc, size: +fitSize([...Q.title].length, DM[0], DM[1]).toFixed(1), pos: 'middle', an: 'pop', sh: 0, ow: PK === 'warm' ? 0 : 1 });
      else if (Q.title) state.texts.push({ id: uid++, tpl: 1, text: Q.title, start: 0.2, dur: td, color: T.c, size: 11, pos: 'middle', an: 'pop', sh: 1 });
      if (PK && Q.end) { const le = L[L.length - 1]; state.texts.push({ id: uid++, tpl: 1, text: Q.end, start: le.start + 0.6, dur: Math.max(1, cOut - 0.8), color: T.tc, size: +fitSize([...Q.end].length, DM[0], DM[1]).toFixed(1), pos: 'middle', an: 'rise', sh: 0, ow: PK === 'warm' ? 0 : 1 }); }
      else if (Q.end) { const ed = Math.min(2.5, Math.max(1, total * 0.15)); state.texts.push({ id: uid++, tpl: 1, text: Q.end, start: Math.max(0, total - ed), dur: ed, color: T.end, size: 10, pos: 'middle', an: 'rise', sh: 1 }); }
      if (T.stk) { let k = 0; for (let i = 1; i < L.length; i++) { if ((i + 1) % 3) continue; const e = L[i]; state.texts.push({ id: uid++, tpl: 1, text: QSTK[(k * 3 + i) % QSTK.length], start: e.start + 0.3, dur: Math.max(0.8, Math.min(1.6, e.d - 0.5)), color: '#222222', size: 6.5, pos: 'middle', ty: -0.2, tx: k % 2 ? 0.14 : -0.14, ow: 0, an: 'pop', bx: k % 2 ? 'burst' : 'bubble' }); k++; } }
      if (PK) { try { relayout(); await packLayers(PK, L[L.length - 1].end, cuts); relayout(); } catch (e) { toast('素材包沒有完整載入（要連網路），其餘照做好了'); } }
      clearSel(); renderAll(); setCur(0); history = []; redoStack = []; updateToolbar();
      Q.done = { sec: total, n: state.clips.length, short: total < D * 0.8, errs: errs.length, music: musicOk };
    } catch (e) { toast('做不出來：' + (e && e.message || '發生問題')); Q.done = null; Q.busy = false; Q.step = 3; render(); return; }
    finally { if (wake) try { wake.release(); } catch (e) {} }
    Q.busy = false; render();
  }
  const doneHtml = () => { const d = Q.done; return `<div class="qbig"><div class="em">🎉</div><h2>做好了！總長 ${fmt(d.sec)}</h2><p class="qh">用了 ${d.n} 段素材${d.music ? '，已配上音樂' : ''}。${d.short ? '素材不夠長，所以比你選的時間短一些；多選一點素材會更接近。' : ''}${d.errs ? `有 ${d.errs} 個素材讀不了，已跳過。` : ''}</p></div>
    <button class="qopt" id="q-play" style="margin-top:20px">▶ 先看看成果</button><button class="qopt" id="q-exp">📤 直接匯出</button>`; };
  function bindDone() {
    document.getElementById('q-play').onclick = () => { close(); if (window.__hideHome) window.__hideHome(); setCur(0); play(); };
    document.getElementById('q-exp').onclick = () => { close(); if (window.__hideHome) window.__hideHome(); $('#btn-export').click(); };
    document.getElementById('qm-edit').onclick = () => { close(); if (window.__hideHome) window.__hideHome(); };
    document.getElementById('qm-again').onclick = () => { Q.done = null; Q.step = 1; Q.files = []; render(); };
  }
  document.getElementById('h-quick').addEventListener('click', open);
})();

// ===== 防止雙擊／雙指縮放 =====
(function () {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
})();

// ===== 預覽畫面：先「輕點」選取（鎖定）素材，才能一指拖移、兩指縮放／旋轉 =====
(function () {
  const stage = document.querySelector('.stage'), ptr = new Map();
  let target = null, start = null, committed = false, lyMode = false;
  const dispK = () => { const r = cv.getBoundingClientRect(); return Math.min(r.width / cv.width, r.height / cv.height) || 1; };
  const toCv = (x, y) => { const r = cv.getBoundingClientRect(), k = dispK(); return { x: (x - (r.left + (r.width - cv.width * k) / 2)) / k, y: (y - (r.top + (r.height - cv.height * k) / 2)) / k }; };
  const info = () => {
    const pts = [...ptr.values()];
    if (pts.length >= 2) return { n: 2, cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2, d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), a: Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x) };
    return { n: 1, cx: pts[0].x, cy: pts[0].y, d: 0, a: 0 };
  };
  const reset = () => { if (!ptr.size) { target = null; start = null; committed = false; return; } lyMode = lyOn(); const en = clipAt(cur);
    target = lyMode ? (state.layers.find(x => x.id === selLy) || null) : (en && selPic === en.c.id ? en.c : null); start = info();
    if (lyMode && target) { start.z = target.w; start.x = target.x; start.y = target.y; } else { start.z = target && target.z || 1; start.x = target && target.x || 0; start.y = target && target.y || 0; }
    start.ang = target && target.ang || 0; };
  let tap0 = null;
  stage.addEventListener('pointerdown', e => { if (!L.length && !state.layers.length) return; if (!ptr.size) tap0 = { x: e.clientX, y: e.clientY, t: Date.now() }; else tap0 = null; ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { stage.setPointerCapture(e.pointerId); } catch (x) {} reset(); });
  stage.addEventListener('pointermove', e => {
    if (!ptr.has(e.pointerId) || !target) return;
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = info(); if (now.n !== start.n) { reset(); return; }
    const k = dispK(), dx = (now.cx - start.cx) / (k * cv.width), dy = (now.cy - start.cy) / (k * cv.height);
    const two = now.n === 2 && start.d > 10;
    const nz = two ? (lyMode ? clamp(start.z * now.d / start.d, 0.1, 2) : clamp(start.z * now.d / start.d, 0.3, 5)) : start.z;
    const nx = lyMode ? clamp(start.x + dx, -0.3, 1.3) : clamp(start.x + dx, -1.5, 1.5), ny = lyMode ? clamp(start.y + dy, -0.3, 1.3) : clamp(start.y + dy, -1.5, 1.5);
    let na = start.ang;
    if (two) { let da = (now.a - start.a) * 180 / Math.PI; da = ((da + 540) % 360 + 360) % 360 - 180; na = start.ang + da; const m = Math.round(na / 90) * 90; if (Math.abs(na - m) < 3) na = m; na = ((na + 180) % 360 + 360) % 360 - 180; }
    if (!committed && (Math.abs(nz - start.z) > 0.005 || Math.abs(nx - start.x) > 0.003 || Math.abs(ny - start.y) > 0.003 || Math.abs(na - start.ang) > 0.5)) { commit(); committed = true; }
    if (committed) { if (lyMode) target.w = nz; else target.z = nz; target.x = nx; target.y = ny; if (Math.abs(na) < 0.05) delete target.ang; else target.ang = +na.toFixed(1); dirty = true; }
  });
  const up = e => {
    const tp = tap0; tap0 = null;
    if (e.type === 'pointerup' && tp && ptr.size === 1 && Math.hypot(e.clientX - tp.x, e.clientY - tp.y) < 8 && Date.now() - tp.t < 500 && (L.length || state.layers.length)) {   // 輕點預覽畫面＝選取那個素材（再點一次取消）；有開著的工具面板就順便收起
      const vb = $('#volp'), open = $('#cats').classList.contains('on') || $('#ctx').style.display === 'block' || (vb && vb.style.display === 'block');
      if (vb && vb.style.display === 'block') vb.style.display = 'none';
      const p = toCv(e.clientX, e.clientY), hit = state.layers.slice().reverse().find(l => cur >= l.start && cur < l.start + l.len && lyHit(l, p.x, p.y));
      if (hit) {
        if (!(lyOn() && selLy === hit.id)) { const keepP = showLy && selLy; clearSel(); selLy = hit.id; if (keepP) { showLy = true; } else lyPick = true; renderTimeline(); renderCtx(); updateToolbar(); dirty = true; }
      } else {
        const en = clipAt(cur), was = en && selPic === en.c.id && !open && !lyOn();
        if (open || lyOn()) { closeCats(); clearSel(); renderTimeline(); renderCtx(); layoutSheet(); updateToolbar(); }
        selPic = en && !was ? en.c.id : null; dirty = true;
      }
    }
    ptr.delete(e.pointerId); reset();
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
})();

/* ===== 配樂庫：音樂放在 music/ 資料夾，學生按「使用」才下載那一首（APP 不會變大）===== */
let libBox = null, libPrev = null, libData = null;
function libStop() { if (libPrev) { try { libPrev.pause(); } catch (e) {} libPrev = null; } }
function libClose() { libStop(); if (libBox) { libBox.remove(); libBox = null; } }
async function libOpen() {
  libClose(); pause();
  libBox = document.createElement('div');
  libBox.style.cssText = 'position:fixed;left:0;right:0;bottom:0;top:12%;z-index:9000;background:#1a1c28;color:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:14px;font-size:15px';
  libBox.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><b style="font-size:17px">🎵 配樂庫</b><button id="lib-x" style="background:#2c2f45;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:15px">關閉</button></div><div id="lib-tabs" style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px"></div><div id="lib-list" style="flex:1;overflow:auto"><p style="opacity:.7">載入中…</p></div>';
  document.body.appendChild(libBox); libBox.querySelector('#lib-x').onclick = libClose;
  try {
    if (!libData) { const r = await fetch('music/manifest.json?v=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw 0; libData = await r.json(); }
  } catch (e) { libBox.querySelector('#lib-list').innerHTML = '<p>要連上網路才能打開配樂庫喔。</p>'; return; }
  const tabs = libBox.querySelector('#lib-tabs'); let curId = (libData.styles.find(x => x.tracks.length) || libData.styles[0]).id;
  const draw = () => {
    tabs.innerHTML = libData.styles.map(x => `<button data-id="${x.id}" style="flex:none;border:0;border-radius:18px;padding:8px 14px;font-size:14px;color:#fff;background:${x.id === curId ? 'var(--main,#7c5cff)' : '#2c2f45'}">${x.emoji} ${x.name}${x.tracks.length ? '' : '（準備中）'}</button>`).join('');
    tabs.querySelectorAll('button').forEach(b => b.onclick = () => { curId = b.dataset.id; libStop(); draw(); });
    const st = libData.styles.find(x => x.id === curId), box = libBox.querySelector('#lib-list');
    if (!st.tracks.length) { box.innerHTML = '<p style="opacity:.7">這個風格的歌還在準備中，敬請期待！</p>'; return; }
    box.innerHTML = st.tracks.map((t, i) => `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #2c2f45"><button data-pv="${i}" style="flex:none;width:42px;height:42px;border-radius:21px;border:0;background:#2c2f45;color:#fff;font-size:16px">▶</button><span style="flex:1">${t.name}</span><button data-use="${i}" style="flex:none;border:0;border-radius:10px;padding:10px 16px;background:var(--main,#7c5cff);color:#fff;font-weight:700;font-size:15px">使用</button></div>`).join('');
    box.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => {
      const t = st.tracks[+b.dataset.pv], url = 'music/' + t.file;
      if (libPrev && libPrev._u === url && !libPrev.paused) { libStop(); box.querySelectorAll('[data-pv]').forEach(x => x.textContent = '▶'); return; }
      libStop(); box.querySelectorAll('[data-pv]').forEach(x => x.textContent = '▶'); const au = new Audio(url); au._u = url; libPrev = au; b.textContent = '⏸';
      au.onended = () => { b.textContent = '▶'; }; au.onerror = () => { toast('這首讀不到，請確認網路'); b.textContent = '▶'; }; au.play().catch(() => {});
    });
    box.querySelectorAll('[data-use]').forEach(b => b.onclick = async () => {
      const t = st.tracks[+b.dataset.use]; libStop(); b.disabled = true; b.textContent = '下載中…';
      try { const r = await fetch('music/' + t.file); if (!r.ok) throw 0; const bl = await r.blob(); const f = new File([bl], t.name + '.mp3', { type: 'audio/mpeg' }); libClose(); await addMusic(f); }
      catch (e) { b.disabled = false; b.textContent = '使用'; toast('下載失敗，請確認網路再試一次'); }
    });
  };
  draw();
}

/* ===== 小工具：在原頁面上蓋一層打開，返回就回到剛剛的地方（編輯中的作品不會消失）===== */
(function () {
  let fr = null;
  function close() { if (fr) { fr.remove(); fr = null; document.documentElement.style.overflow = ''; } }
  function open(href) {
    close(); fr = document.createElement('iframe'); fr.src = href; fr.setAttribute('allow', 'camera;microphone;fullscreen');
    fr.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99999;background:#14161f';
    document.body.appendChild(fr);
  }
  addEventListener('message', e => { if (e.data === 'ip-tools-close') close(); });
  document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[href^="tools.html"]'); if (!a) return; e.preventDefault(); open(a.getAttribute('href')); }, true);
})();

// ===== 自動檢查新版本 =====
(function () {
  const VER = '1121-AR', upd = document.getElementById('upd');
  const reloadNew = () => {
    try { const t = +sessionStorage.getItem('ipsj-rl') || 0; if (Date.now() - t < 60000) return; sessionStorage.setItem('ipsj-rl', String(Date.now())); } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now());
  };
  upd.addEventListener('click', async () => { try { if (pjHas() && pjDirty()) { upd.textContent = '先自動暫存你的作品…'; await pjSave(PJ.cur ? null : '自動暫存 ' + new Date().toLocaleString('zh-TW'), true); } } catch (e) {} try { sessionStorage.removeItem('ipsj-rl'); } catch (e) {} reloadNew(); });
  let busy = false;
  async function check() {
    if (busy) return; busy = true;
    try {
      const r = await fetch('index.html?chk=' + Date.now(), { cache: 'no-store' });
      const m = /版本 ([0-9A-Za-z\-]+)/.exec(await r.text());
      if (m && m[1] !== VER) {
        if (!state.clips.length) reloadNew(); else upd.style.display = 'block';
      }
    } catch (e) {}
    busy = false;
  }
  const st = document.getElementById('h-chk-st'), btn = document.getElementById('h-chk');
  btn.addEventListener('click', async () => {
    st.style.color = ''; st.textContent = '檢查中…'; btn.disabled = true;
    try {
      const r = await fetch('index.html?chk=' + Date.now(), { cache: 'no-store' });
      const m = /版本 ([0-9A-Za-z\-]+)/.exec(await r.text());
      if (!m) throw new Error('x');
      if (m[1] === VER) { st.style.color = '#2ec27e'; st.textContent = '✅ 已經是最新版（' + VER + '）'; }
      else if (state.clips.length && !confirm('有新版本（' + m[1] + '）。更新後目前剪的內容會消失，確定要更新嗎？')) { st.textContent = '有新版本 ' + m[1] + '，你選擇先不更新'; }
      else { st.textContent = '找到新版本 ' + m[1] + '，更新中…'; try { sessionStorage.removeItem('ipsj-rl'); } catch (e) {} reloadNew(); }
    } catch (e) { st.style.color = '#ff6b6b'; st.textContent = '❌ 檢查失敗，請確認有連上網路'; }
    btn.disabled = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('pageshow', check);
  check();
})();

// ===== 影片軸下方的快速按鈕 =====
(function () {
  document.getElementById('q-text').addEventListener('click', () => { if (!L.length) return toast('請先按時間軸右邊的「＋」加入影片或照片'); pause(); ops.text(); });
  document.getElementById('q-music').addEventListener('click', () => { if (!L.length) return toast('請先按時間軸右邊的「＋」加入影片或照片'); pause(); ops.music(); });
})();
