<style>
:root{--bg:#14161f;--panel:#1d2030;--panel2:#262a3d;--line:#343a55;--text:#eef1ff;--sub:#99a2c8;--main:#5b86ff;--hot:#ff9f43;--ok:#2ec27e;--err:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
#app{height:100dvh;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--panel)}
.top b{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{background:linear-gradient(135deg,#5b86ff,#a05bff);color:#fff;font-weight:900;font-size:13px;padding:4px 7px;border-radius:8px;letter-spacing:1px;white-space:nowrap}
.top a{color:var(--sub);font-size:20px;text-decoration:none;white-space:nowrap;padding:0 2px}
.top select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:13px}
.top .exp{background:var(--main);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.stage{touch-action:none;flex:1;min-height:120px;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-size:15px;padding:20px;pointer-events:none;line-height:1.7}
.transport{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--panel)}
.transport button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;min-width:44px}
.transport .play{background:var(--main);border-color:var(--main);font-size:18px;min-width:56px}
.transport .time{flex:1;text-align:center;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.transport .time b{color:var(--text);font-size:15px}
.tl{position:relative;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#scroller{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scroller::-webkit-scrollbar{display:none}
#inner{position:relative;padding-bottom:6px}
.ruler{position:relative;height:20px}
.ruler i{position:absolute;top:0;font-style:normal;font-size:10px;color:var(--sub);border-left:1px solid var(--line);padding-left:3px;height:20px;line-height:18px;white-space:nowrap}
.row{position:relative;margin-top:4px}
.row.v{height:50px}
.clip{position:absolute;top:0;height:50px;border-radius:8px;overflow:hidden;background:#3a4166 center/auto 100% repeat-x;border:2px solid #4a5284;color:#fff;font-size:11px}
.clip.active{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot)}
.clip span{position:absolute;left:0;right:0;bottom:0;padding:2px 5px;background:rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.mute::after{content:"🔇";position:absolute;right:3px;top:2px;font-size:12px}
.tblock,.mblock{position:absolute;height:24px;border-radius:6px;font-size:12px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tblock{background:#7a52d6;border:2px solid #7a52d6}
.tblock.sel{border-color:var(--hot)}
.mblock{background:#1f8f6a;border:2px solid #1f8f6a}
.mblock.sel{border-color:var(--hot)}
.vblock{background:#b8467a;border:2px solid #b8467a}
.ruler b.bt{position:absolute;top:8px;width:3px;height:12px;background:#ffb347;border-radius:2px;margin-left:-1px}
.playhead{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;margin-left:-1px;pointer-events:none;z-index:3;box-shadow:0 0 4px rgba(0,0,0,.6)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#fff}
.quick{display:flex;gap:8px;padding:4px 8px;background:var(--bg)}
.quick button{flex:1;background:var(--panel2);color:var(--text);border:1px dashed var(--line);border-radius:9px;padding:6px 4px;font-size:13px;font-weight:700}
.quick button:active{background:var(--line)}
.toolbar{display:flex;gap:4px;overflow-x:auto;padding:6px;background:var(--panel);scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;min-width:50px;background:transparent;border:0;color:var(--text);padding:3px 4px;border-radius:10px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tb i{font-style:normal;font-size:17px;line-height:1}
.tb:active{background:var(--panel2)}
.tb:disabled{opacity:.35}
.ctx{background:var(--panel);padding:6px 12px 8px;max-height:13vh;overflow-y:auto;border-top:1px solid var(--line);font-size:14px}
.ctx.edit{max-height:30vh}
.ctx h4{margin:4px 0 6px;font-size:13px;color:var(--sub);font-weight:600}
.ctx label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
.ctx input[type=number],.ctx textarea,.ctx select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px;font-family:inherit}
.ctx textarea{min-height:54px;resize:vertical}
.ctx input[type=range]{width:100%;height:30px}
.ctx .r2{display:flex;gap:8px}.ctx .r2>*{flex:1}
.ctx .sm{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font-size:13px;font-weight:700}
.ctx .sm.red{color:var(--err);border-color:#6b3a46}
.ctx .sm.ok{background:var(--main);border-color:var(--main)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;color:var(--text);font-size:14px}
.hint{font-size:12px;color:var(--sub);margin:4px 0}
.tmark{position:absolute;top:16px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#262a3d;border:2px solid #fff;color:#fff;font-size:13px;line-height:22px;text-align:center;z-index:30;box-shadow:0 1px 4px #0008}
.tmark.on{background:var(--hot);border-color:var(--hot);color:#000;font-weight:800}
.tmark.sel{box-shadow:0 0 0 3px #fff8}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.fchips .sm{flex:0 0 auto;min-width:58px}
.ctx label b{color:var(--text);font-weight:700;margin-left:6px}
.lblock{position:absolute;height:24px;border-radius:6px;font-size:12px;line-height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#d6527a;border:2px solid #d6527a}
.lblock.sel{border-color:var(--hot)}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.tplb{flex:0 0 auto;width:62px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:6px 4px 4px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.tplb svg{width:30px;height:40px}
.tplb svg rect{fill:#5b86ff55;stroke:#8fb0ff;stroke-width:.8}
.tabs4{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.tabs4 .sm{padding:9px 0;font-size:11.5px}
.trg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.trg .sm{padding:10px 4px}
#home{position:fixed;inset:0;z-index:60;background:#07070d;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;text-align:center;overflow:hidden;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#home.off{display:none}
#home .bl{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform;pointer-events:none}
#home .b1{width:300px;height:300px;background:#8b5cff;top:-90px;left:-80px;animation:fl1 14s ease-in-out infinite alternate}
#home .b2{width:260px;height:260px;background:#ff4f9a;top:30%;right:-110px;animation:fl2 17s ease-in-out infinite alternate}
#home .b3{width:280px;height:280px;background:#25c7ff;bottom:-110px;left:-60px;opacity:.4;animation:fl3 16s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(70px,90px) scale(1.15)}}
@keyframes fl2{to{transform:translate(-80px,-60px) scale(1.2)}}
@keyframes fl3{to{transform:translate(90px,-70px) scale(1.1)}}
#home>*:not(.bl){position:relative;z-index:1;animation:up .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#home .hlogo{background:linear-gradient(135deg,#5b86ff,#a05bff 55%,#ff5fa2);color:#fff;font-weight:900;font-size:26px;padding:12px 18px;border-radius:22px;letter-spacing:2px;line-height:1.15;box-shadow:0 10px 36px #a05bff88,inset 0 1px 0 #ffffff66;transform:rotate(-6deg)}
#home h1{margin:18px 0 10px;font-size:27px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#fff 20%,#d9c8ff 55%,#8fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#home .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#home .chips span{font-size:12px;font-weight:700;color:#e9e4ff;padding:5px 11px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;backdrop-filter:blur(6px)}
#home .hbtn{display:block;width:100%;max-width:360px;border:0;font-family:inherit;font-weight:900;color:#fff}
#home #h-start{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;margin-top:26px;padding:14px 18px 14px 14px;border-radius:99px;font-size:21px;letter-spacing:2px;text-align:left;background:linear-gradient(110deg,#6d5cff 0%,#b44dff 55%,#ff3fb4 100%);background-size:200% 200%;animation:up .6s both,gs 7s ease infinite;box-shadow:0 12px 34px #b44dff66,inset 0 1px 0 #ffffff66}
@keyframes gs{50%{background-position:100% 50%}}
#home #h-start::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff44,transparent);transform:skewX(-20deg);animation:sh 4.5s ease-in-out infinite}
@keyframes sh{0%,60%{left:-60%}100%{left:130%}}
#home #h-start .pl{flex:none;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 12px #0004}
#home #h-start .pl svg{width:28px;height:28px;stroke:#8a3dff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#home #h-start .lb{flex:1}
#home #h-start .ar{flex:none;font-size:30px;line-height:1;opacity:.9;margin-right:4px}
#home #h-start:active{transform:scale(.97)}
#home .hbtn.sub{margin-top:12px;padding:14px 10px;font-size:16px;background:#ffffff12;border:1px solid #ffffff22;border-radius:18px}
#home .hbox{width:100%;max-width:360px;margin-top:24px;text-align:left}
#home .hbox .ht{font-size:15px;color:#fff;margin:0 4px 12px;font-weight:800;letter-spacing:1px;opacity:.9}
#home .hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#home .tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;color:#d9d9e3;padding:0;font-size:13px;font-weight:700;text-decoration:none;font-family:inherit;-webkit-tap-highlight-color:transparent}
#home .tile i{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:22px;background:linear-gradient(160deg,#ffffff1c,#ffffff08);border:1px solid #ffffff1f;color:#fff;backdrop-filter:blur(12px);box-shadow:0 8px 18px #0007,inset 0 1px 0 #ffffff26;transition:transform .15s,background .15s}
#home .tile i svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#home .tile:active i{transform:scale(.9);background:linear-gradient(160deg,#a67bff55,#ff4f9a33)}
#home .tile:disabled{opacity:.6}
#home .hgrid{row-gap:20px}
#home .hfoot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:0;right:0;font-size:11px;color:#ffffff80;animation:none}
@media (prefers-reduced-motion:reduce){#home *{animation:none!important}}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:90;background:#ff9f43;color:#2a1300;font-weight:800;font-size:15px;padding:12px 14px;border-radius:14px;text-align:center;box-shadow:0 6px 20px #000a;display:none}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
#pj{position:fixed;inset:0;background:#000b;z-index:70;display:none;align-items:flex-end;justify-content:center}#pj.on{display:flex}
#pj .box{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
#pj h3{margin:0 0 10px}#pj label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
#pj input[type=text]{width:100%;box-sizing:border-box;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px}
#pj .bigbtn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;margin-top:10px;background:var(--main);color:#fff}
#pj .bigbtn.x{background:var(--panel2);color:var(--text)}
#pj .it{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:8px;margin-top:8px}
#pj .it img{width:40px;height:64px;object-fit:cover;border-radius:6px;background:#000;flex:none}
#pj .it .nm{flex:1;min-width:0}#pj .it b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pj .it small{color:var(--sub);font-size:12px}
#pj .it button{border:0;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;background:var(--panel);color:var(--text)}#pj .it button.go{background:var(--main);color:#fff}#pj .it button.del{color:#ff6b6b}
.top #btn-pj{background:none;border:0;font-size:20px;color:var(--sub);padding:0 4px}
#xp{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:flex-end;justify-content:center}
#xp.on{display:flex}
#xp .box{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
#xp h3{margin:0 0 10px}
#xp label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
#xp select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px}
#xp .bigbtn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:800;margin-top:10px;background:var(--main);color:#fff}
#xp .bigbtn.g{background:var(--ok)}#xp .bigbtn.x{background:var(--panel2);color:var(--text)}
#xp .bar{height:14px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:12px;display:none}
#xp .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
#xp .st{font-size:14px;margin-top:8px;color:var(--sub);white-space:pre-wrap}
#xp .st.err{color:var(--err)}#xp .st.ok{color:var(--ok)}
#xp video,#xp audio{width:100%;margin-top:10px;border-radius:10px;max-height:40vh;background:#000}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.02;pointer-events:none;overflow:hidden}
</style>
</head>
<body>
<div id="upd">🔄 有新版本了，點這裡更新（更新後目前剪的內容會消失，請先匯出）</div>
<div id="home">
  <div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>
  <div class="hlogo">IP<br>神剪</div>

    <a class="tile c2" href="tools.html#merge"><i><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 1 0-5.6l2.4-2.4a4 4 0 0 1 5.6 5.6l-1.2 1.2M14 10a4 4 0 0 1 0 5.6L11.6 18a4 4 0 0 1-5.6-5.6l1.2-1.2"/></svg></i>合併</a>

    <a class="tile c4" href="tools.html#sub"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M7 11h4M13 11h4M7 15h7"/></svg></i>加字幕</a>
    <a class="tile c5" href="tools.html#zip"><i><svg viewBox="0 0 24 24"><path d="M4 4l6 6M10 4.5V10H4.5M20 20l-6-6M14 19.5V14h5.5"/></svg></i>壓縮</a>
    <button class="tile c6" id="h-chk"><i><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg></i>檢查更新</button>
  </div></div>
  <div id="h-chk-st" style="margin-top:10px;font-size:13px;color:var(--sub);min-height:18px"></div>

</div>
<div id="app">
  <div class="top">
    <span class="logo">IP神剪</span>

    <button id="btn-pj" title="我的專案（暫存）">📁</button>
    <select id="ratio"><option value="9:16">9:16 直</option><option value="16:9">16:9 橫</option><option value="1:1">1:1 方</option><option value="4:3">4:3 橫</option><option value="3:4">3:4 直</option></select>

<script>
const $ = s => document.querySelector(s);
const { FFmpeg } = FFmpegWASM, { fetchFile } = FFmpegUtil;

/* ================= 資料 ================= */
const assets = new Map();           // id -> {id,kind,file,url,el,img,w,h,dur,name,thumb}
let uid = 1;
let state = { ratio: '9:16', clips: [], layers: [], texts: [], music: null, kb: false, vol: { video: 1, music: 0.6 } };
let history = [], redoStack = [], lastTouch = null;
let showAu = false, showSt = false, showEf = false, showKf = false, kfMode = 'clip', kfLyId = null, kfIdx = -1;
let showFx = false, fxTab = 'f', fxIdx = -1, showLy = false, selLy = null, lyTab = 'p', pendingTpl = null;
let cur = 0, playing = false, pps = 80, selText = null, selMusic = false, selTr = null, showAuto = false, dirty = true;
function clearSel() { showAu = false; showSt = false; showEf = false; showKf = false; showLy = false; selLy = null; showFx = false; selText = null; selMusic = false; selTr = null; showAuto = false; }
let L = [], total = 0;               // 排版結果
const FXP = {
  none: { n: '原圖', b: 0, ct: 1, sa: 1, r: 1, g: 1, bl: 1 },
  vintage: { n: '復古', b: .02, ct: 1.05, sa: .75, r: 1.08, g: 1, bl: .85 },
  cinema: { n: '電影', b: -.03, ct: 1.2, sa: .9, r: 1.06, g: 1, bl: .94 },
  japan: { n: '日系', b: .08, ct: .9, sa: .85, r: 1, g: 1.03, bl: 1.06 },
  bw: { n: '黑白', b: 0, ct: 1.15, sa: 0, r: 1, g: 1, bl: 1 },
  vivid: { n: '鮮豔', b: 0, ct: 1.1, sa: 1.5, r: 1, g: 1, bl: 1 },
  cool: { n: '冷調', b: 0, ct: 1, sa: 1, r: .92, g: 1, bl: 1.1 },
  warm: { n: '暖調', b: 0, ct: 1, sa: 1, r: 1.1, g: 1.02, bl: .9 }
};
const fxP = c => { const p = FXP[c.fp] || FXP.none; return { b: p.b + (c.fb || 0), ct: p.ct * (c.fc == null ? 1 : c.fc), sa: p.sa * (c.fs == null ? 1 : c.fs), r: p.r, g: p.g, bl: p.bl }; };
const hasFx = c => { const q = fxP(c); return Math.abs(q.b) > .001 || Math.abs(q.ct - 1) > .001 || Math.abs(q.sa - 1) > .001 || q.r !== 1 || q.g !== 1 || q.bl !== 1; };
const spd = c => c.sp || 1;
const RATIO = { '9:16': [360, 640], '16:9': [640, 360], '1:1': [480, 480], '4:3': [640, 480], '3:4': [480, 640] };

const fmt = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }

function commit() { history.push(JSON.stringify(state)); if (history.length > 60) history.shift(); redoStack = []; lastTouch = null; }
function touch(kind) { if (lastTouch !== kind) { commit(); lastTouch = kind; } }
function restore(s) {
  state = JSON.parse(s); selTr = null; showAuto = false;
  if (selText && !state.texts.find(t => t.id === selText)) selText = null;
  if (state.music && !assets.get(state.music.asset)) state.music = null;
  if (!state.music) selMusic = false;
  $('#ratio').value = state.ratio; applyRatio(); relayout(); renderAll();
}
function undo() { if (!history.length) return toast('沒有可以復原的了'); redoStack.push(JSON.stringify(state)); restore(history.pop()); lastTouch = null; }
function redo() { if (!redoStack.length) return toast('沒有可以重做的了'); history.push(JSON.stringify(state)); restore(redoStack.pop()); lastTouch = null; }

/* ================= 版面計算 ================= */
function relayout() {
  L = [];
  state.clips.forEach((c, i) => {
    const d = (c.out - c.in) / spd(c); let td = 0;
    if (i > 0 && c.tr) { td = Math.min(c.tr.dur, 0.45 * Math.min(L[i - 1].d, d)); td = Math.round(td * 30) / 30; if (td < 0.2) td = 0; }
    const start = i ? L[i - 1].end - td : 0;
    L.push({ c, i, start, end: start + d, d, td });
  });
  const mainEnd = L.length ? L[L.length - 1].end : 0, lyEnd = (state.layers || []).reduce((m, l) => Math.max(m, l.start + l.len), 0);
  total = Math.max(mainEnd, lyEnd); cur = clamp(cur, 0, total);
}
function clipAt(t) {
  if (!L.length) return null;
  for (let k = L.length - 1; k >= 0; k--) if (t >= L[k].start && t < L[k].end) return L[k];
  return L[L.length - 1];
}

/* ===== 直接拍攝＋倒數計時 ===== */
let camS = null;
function camClose() { if (!camS) return; try { if (camS.mr && camS.mr.state !== 'inactive') { camS.mr.onstop = null; camS.mr.stop(); } } catch (er) {} clearInterval(camS.tm); clearTimeout(camS.cd); if (camS.stream) camS.stream.getTracks().forEach(t => t.stop()); camS.box.remove(); camS = null; }
async function camStart(face) {
  if (camS.stream) camS.stream.getTracks().forEach(t => t.stop());
  try { camS.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: true }); }
  catch (e) { try { camS.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: face }, audio: false }); toast('沒有取得麥克風，這支影片會沒有聲音'); } catch (e2) { toast('沒有取得相機權限，請在瀏覽器允許使用相機'); camClose(); return; } }
  camS.face = face; const v = camS.box.querySelector('video'); v.srcObject = camS.stream; v.style.transform = face === 'user' ? 'scaleX(-1)' : 'none'; v.play().catch(() => {});
}
async function camOpen() {
  if (camS) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') return toast('這個瀏覽器不支援直接拍攝，請用「＋素材」選相機拍好的影片');
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:space-between';
  box.innerHTML = `<div style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-size:15px"><button id="cm-x" style="background:#0008;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-size:15px">✕ 取消</button><b id="cm-t">準備拍攝</b><button id="cm-f" style="background:#0008;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-size:15px">🔄 翻轉</button></div>
  <div style="flex:1;width:100%;position:relative;min-height:0"><video playsinline muted style="width:100%;height:100%;object-fit:contain;background:#000"></video><div id="cm-n" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;font-weight:800;color:#fff;text-shadow:0 0 20px #000"></div></div>
  <div style="padding:14px;display:flex;align-items:center;gap:22px;color:#fff;font-size:14px"><label style="display:flex;flex-direction:column;align-items:center;gap:4px">倒數<select id="cm-c" style="font-size:15px;padding:4px"><option value="0">不倒數</option><option value="3" selected>3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select></label>
  <button id="cm-r" style="width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#e33;color:#fff;font-size:15px;font-weight:700">拍攝</button><span style="width:70px"></span></div>`;
  document.body.appendChild(box); camS = { box, stream: null, mr: null, face: 'environment' };
  const q = id => box.querySelector(id);
  q('#cm-x').onclick = camClose;
  q('#cm-f').onclick = () => { if (camS.mr || camS.cd) return toast('拍攝中不能翻轉'); camStart(camS.face === 'user' ? 'environment' : 'user'); };
  q('#cm-r').onclick = () => {
    if (camS.mr) return camStop();
    if (camS.cd) { clearTimeout(camS.cd); camS.cd = null; q('#cm-n').style.display = 'none'; q('#cm-r').textContent = '拍攝'; q('#cm-t').textContent = '準備拍攝'; return; }
    let n = +q('#cm-c').value; q('#cm-r').textContent = '取消';
    const step = () => { if (n <= 0) { q('#cm-n').style.display = 'none'; camS.cd = null; return camRec(); } q('#cm-n').style.display = 'flex'; q('#cm-n').textContent = n; q('#cm-t').textContent = '倒數中…'; n--; camS.cd = setTimeout(step, 1000); };
    step();
  };
  await camStart('environment');
}
function camRec() {
  const st = camS.stream, q = id => camS.box.querySelector(id);
  const mt = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '', chunks = [];
  let mr; try { mr = new MediaRecorder(st, mt ? { mimeType: mt } : undefined); } catch (e) { toast('這支手機無法錄影'); return camClose(); }
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => camDone(chunks, mr.mimeType || mt || 'video/webm');
  camS.mr = mr; camS.t0 = Date.now(); mr.start(500);
  q('#cm-r').textContent = '停止'; q('#cm-x').style.visibility = 'hidden'; q('#cm-f').style.visibility = 'hidden';
  camS.tm = setInterval(() => { const sec = Math.floor((Date.now() - camS.t0) / 1000); q('#cm-t').textContent = '🔴 錄影中 ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); if (sec >= 300) camStop(); }, 300);
}
function camStop() { if (camS && camS.mr && camS.mr.state !== 'inactive') camS.mr.stop(); }
async function camDone(chunks, type) {
  const isMp4 = /mp4/.test(type), n = 1 + [...assets.values()].filter(a => /^拍攝/.test(a.name)).length;
  let blob = new Blob(chunks, { type: isMp4 ? 'video/mp4' : 'video/webm' });
  const box = camS && camS.box; if (box) { box.querySelector('#cm-t').textContent = '處理中…'; box.querySelector('#cm-r').style.display = 'none'; }
  let file = new File([blob], `拍攝${n}.${isMp4 ? 'mp4' : 'webm'}`, { type: blob.type });
  if (!isMp4) {   // webm 沒有影片長度資訊，用 ffmpeg 重新封裝（不重新壓縮，很快）補上
    try { const f = await getFF(); await f.writeFile('cam_in.webm', await fetchFile(file)); const rc = await f.exec(['-i', 'cam_in.webm', '-c', 'copy', '-y', 'cam_out.webm']); if (rc === 0) { const d = await f.readFile('cam_out.webm'); file = new File([d], file.name, { type: 'video/webm' }); } try { await f.deleteFile('cam_in.webm'); await f.deleteFile('cam_out.webm'); } catch (er) {} } catch (er) { console.error(er); }
  }
  camClose(); await addMedia([file]); if (window.__hideHome) window.__hideHome(); toast('拍好了，已加入時間軸');
}
/* ================= 匯入素材 ================= */
function loadVideo(a) {
  return new Promise((res, rej) => {
    const el = document.createElement('video'); let done = false, t1, t2;
    const fail = msg => { if (done) return; done = true; clearTimeout(t1); clearTimeout(t2); try { el.removeAttribute('src'); el.load(); el.remove(); } catch (e) {} rej(new Error(msg)); };
    const ok = () => { if (done) return; done = true; clearTimeout(t1); clearTimeout(t2); el.onseeked = null; el.addEventListener('seeked', () => dirty = true); res(); };
    el.playsInline = true; el.preload = 'auto'; el.src = a.url; el.setAttribute('playsinline', '');
    $('#pool').appendChild(el);
    el.addEventListener('seeked', () => dirty = true); el.addEventListener('loadeddata', () => dirty = true);
    el.onerror = () => fail('「' + a.name + '」這支影片格式讀不了（可能是 HEVC/H.265 或損壞），請改用 MP4(H.264) 的影片');
    t1 = setTimeout(() => fail('「' + a.name + '」讀取太久沒有回應，已跳過（檔案太大或格式不支援）'), 25000);
    el.onloadedmetadata = () => {
      if (!isFinite(el.duration) || !el.videoWidth) return fail('「' + a.name + '」讀不到影片長度或畫面，已跳過');
      a.el = el; a.w = el.videoWidth; a.h = el.videoHeight; a.dur = el.duration;
      t2 = setTimeout(ok, 5000);   // 取縮圖等太久就不等了，照樣匯入
      el.onseeked = () => {
        try { const c = document.createElement('canvas'); c.height = 80; c.width = Math.round(80 * a.w / a.h) || 80;
          c.getContext('2d').drawImage(el, 0, 0, c.width, c.height); a.thumb = c.toDataURL('image/jpeg', 0.6); } catch (e) {}
        ok();
      };
      try { el.currentTime = Math.min(0.1, el.duration / 2); } catch (e) { ok(); }
    };
  });
}
function loadImage(a) {
  return new Promise((res, rej) => {
    const img = new Image(); let done = false;
    const t = setTimeout(() => { if (!done) { done = true; rej(new Error('「' + a.name + '」照片讀取太久沒有回應，已跳過')); } }, 20000);
    img.onload = () => { if (done) return; done = true; clearTimeout(t); a.img = img; a.w = img.naturalWidth; a.h = img.naturalHeight; a.thumb = a.url; res(); };
    img.onerror = () => { if (done) return; done = true; clearTimeout(t); rej(new Error('「' + a.name + '」這張照片讀不了（HEIC 之類的格式請先轉成 JPG）')); }; img.src = a.url;
  });
}
async function makeAsset(file) {
  const a = { id: uid++, file, url: URL.createObjectURL(file), name: file.name, kind: file.type.startsWith('image/') ? 'image' : file.type.startsWith('audio/') ? 'audio' : 'video' };
  try { if (a.kind === 'video') await loadVideo(a); else if (a.kind === 'image') await loadImage(a); }
  catch (e) { URL.revokeObjectURL(a.url); throw e; }
  assets.set(a.id, a); return a;
}
async function addMedia(files) {
  commit(); const n = files.length, res = new Array(n), errs = []; let next = 0, fin = 0;
  const show = () => toast('匯入中 ' + fin + ' / ' + n + '…');
  show();
  const worker = async () => {   // 同時處理 2 個，順序仍照選的順序
    while (next < n) {
      const i = next++, f = files[i];
      try { res[i] = await makeAsset(f); } catch (e) { errs.push(e.message); }
      fin++; show();
    }
  };
  await Promise.all([worker(), worker()]);
  let okN = 0;
  for (const a of res) if (a) { state.clips.push({ id: uid++, asset: a.id, in: 0, out: a.kind === 'image' ? 3 : a.dur, mute: false }); okN++; }
  relayout(); renderAll();
  if (errs.length) { toast('成功 ' + okN + ' 個，失敗 ' + errs.length + ' 個：' + errs[0] + (errs.length > 1 ? '（還有 ' + (errs.length - 1) + ' 個失敗）' : '')); if (!okN) { try { history.pop(); } catch (e) {} } }
  else toast('已加入 ' + okN + ' 個素材');
}
async function addMusic(file) {
  try {
    const a = { id: uid++, file, url: URL.createObjectURL(file), name: file.name, kind: 'audio' };
    const au = new Audio(); au.preload = 'auto'; au.src = a.url;
    await new Promise((res, rej) => { au.onloadedmetadata = res; au.onerror = () => rej(new Error('這個檔案讀不出聲音')); });
    a.el = au; a.dur = au.duration; assets.set(a.id, a);
    commit(); state.music = { asset: a.id, offset: 0 }; clearSel(); selMusic = true;
    relayout(); renderAll(); toast('已加入配樂');
  } catch (e) { toast(e.message); }
}

/* ================= 預覽引擎 ================= */
const cv = $('#cv'), g = cv.getContext('2d');
function applyRatio() { const [w, h] = RATIO[state.ratio]; cv.width = w; cv.height = h; dirty = true; }
const textAnc = {}, textAncEx = {};
function drawText(g, W, H, x, tl) {
  const fs = Math.round(H * x.size / 100);
  g.font = `700 ${fs}px "PingFang TC","Noto Sans TC","Microsoft JhengHei","Apple Color Emoji","Noto Color Emoji",sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  const lines = [];
  for (const para of x.text.split('\n')) {
    let c = '';
    for (const ch of para) { if (g.measureText(c + ch).width > W * 0.9 && c) { lines.push(c); c = ch; } else c += ch; }
    lines.push(c);

  try { const e = await navigator.storage.estimate(); $('#pj-st').textContent = `專案存在這支手機的瀏覽器裡（約已用 ${pjFmtSize(e.usage)}，還能用約 ${pjFmtSize(Math.max(0, e.quota - e.usage))}）。清除瀏覽器資料就會不見；iPhone 建議把網頁「加入主畫面」使用，比較不會被系統清掉。每 30 秒會自動更新已儲存過的專案。`; } catch (er) { $('#pj-st').textContent = '專案存在這支手機的瀏覽器裡，清除瀏覽器資料就會不見。每 30 秒會自動更新已儲存過的專案。'; }
}
function pjClose() { $('#pj').classList.remove('on'); }
async function pjShow() { $('#pj-name').value = PJ.name; $('#pj').classList.add('on'); try { await pjRender(); } catch (e) { $('#pj-st').textContent = '這個瀏覽器不能用暫存功能（可能是無痕模式）'; } }
$('#btn-pj').onclick = pjShow; $('#h-proj').onclick = pjShow; $('#pj-close').onclick = pjClose;
$('#pj-save').onclick = async () => { const nm = $('#pj-name').value.trim(); if (await pjSave(nm || undefined)) { $('#pj-name').value = PJ.name; pjRender(); } };
$('#pj-new').onclick = pjNew;
setInterval(() => { if (PJ.cur && pjDirty() && !playing) pjSave(undefined, true); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.hidden && PJ.cur && pjDirty()) pjSave(undefined, true); });

/* ================= 啟動 ================= */
window.addEventListener('beforeunload', e => { if (state.clips.length && !exporting && pjDirty()) { e.preventDefault(); e.returnValue = ''; } });
window.ED = { get state() { return state; }, refresh() { relayout(); renderAll(); }, setCur, ops, get total() { return total; }, get L() { return L; } };
applyRatio(); renderAll(); requestAnimationFrame(tick);

// ===== 首頁 =====
(function () {
  const home = document.getElementById('home');
  const hideHome = () => home.classList.add('off');
  const showHome = () => {
    document.getElementById('h-cont').style.display = (state.clips && state.clips.length) ? 'block' : 'none';
    document.querySelector('#h-start .lb').textContent = (state.clips && state.clips.length) ? '再加素材' : '開始剪輯';
    home.classList.remove('off');
  };
  document.getElementById('h-start').addEventListener('click', () => { document.getElementById('f-media').click(); });
  document.getElementById('h-cont').addEventListener('click', hideHome);
  window.__hideHome = hideHome;
  document.querySelector('.top .logo').addEventListener('click', showHome);
})();

// ===== 防止雙擊／雙指縮放 =====
(function () {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
})();

// ===== 預覽畫面：兩指縮放、一指拖移（只作用在目前這一段） =====
(function () {
  const stage = document.querySelector('.stage'), ptr = new Map();
  let target = null, start = null, committed = false, lyMode = false;
  const dispK = () => { const r = cv.getBoundingClientRect(); return Math.min(r.width / cv.width, r.height / cv.height) || 1; };
  const info = () => {
    const pts = [...ptr.values()];
    if (pts.length >= 2) return { n: 2, cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2, d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) };
    return { n: 1, cx: pts[0].x, cy: pts[0].y, d: 0 };
  };
  const reset = () => { if (!ptr.size) { target = null; start = null; committed = false; return; } lyMode = !!(showLy && selLy); const en = clipAt(cur); target = lyMode ? (state.layers.find(x => x.id === selLy) || null) : (en ? en.c : null); start = info();
    if (lyMode && target) { start.z = target.w; start.x = target.x; start.y = target.y; } else { start.z = target && target.z || 1; start.x = target && target.x || 0; start.y = target && target.y || 0; } };
  stage.addEventListener('pointerdown', e => { if (!L.length && !state.layers.length) return; ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); try { stage.setPointerCapture(e.pointerId); } catch (x) {} reset(); });
  stage.addEventListener('pointermove', e => {
    if (!ptr.has(e.pointerId) || !target) return;
    ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const now = info(); if (now.n !== start.n) { reset(); return; }
    const k = dispK(), dx = (now.cx - start.cx) / (k * cv.width), dy = (now.cy - start.cy) / (k * cv.height);
    const nz = now.n === 2 && start.d > 10 ? (lyMode ? clamp(start.z * now.d / start.d, 0.1, 2) : clamp(start.z * now.d / start.d, 0.3, 5)) : start.z;
    const nx = lyMode ? clamp(start.x + dx, -0.3, 1.3) : clamp(start.x + dx, -1.5, 1.5), ny = lyMode ? clamp(start.y + dy, -0.3, 1.3) : clamp(start.y + dy, -1.5, 1.5);
    if (!committed && (Math.abs(nz - start.z) > 0.005 || Math.abs(nx - start.x) > 0.003 || Math.abs(ny - start.y) > 0.003)) { commit(); committed = true; }
    if (committed) { if (lyMode) target.w = nz; else target.z = nz; target.x = nx; target.y = ny; dirty = true; }
  });
  const up = e => { ptr.delete(e.pointerId); reset(); };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
})();

// ===== 自動檢查新版本 =====
(function () {
  const VER = '1121-P', upd = document.getElementById('upd');
  const reloadNew = () => {
    try { const t = +sessionStorage.getItem('ipsj-rl') || 0; if (Date.now() - t < 60000) return; sessionStorage.setItem('ipsj-rl', String(Date.now())); } catch (e) {}
    location.replace(location.pathname + '?v=' + Date.now());
  };
  upd.addEventListener('click', () => { try { sessionStorage.removeItem('ipsj-rl'); } catch (e) {} reloadNew(); });
  let busy = false;
  async function check() {
    if (busy) return; busy = true;
    try {
      const r = await fetch('index.html?chk=' + Date.now(), { cache: 'no-store' });
      const m = /版本 ([0-9A-Za-z\-]+)/.exec(await r.text());
      if (m && m[1] !== VER) {
        if (!state.clips.length) reloadNew(); else upd.style.display = 'block';
      }
    } catch (e) {}
    busy = false;
  }
  const st = document.getElementById('h-chk-st'), btn = document.getElementById('h-chk');
  btn.addEventListener('click', async () => {
    st.style.color = ''; st.textContent = '檢查中…'; btn.disabled = true;
    try {
      const r = await fetch('index.html?chk=' + Date.now(), { cache: 'no-store' });
      const m = /版本 ([0-9A-Za-z\-]+)/.exec(await r.text());
      if (!m) throw new Error('x');
      if (m[1] === VER) { st.style.color = '#2ec27e'; st.textContent = '✅ 已經是最新版（' + VER + '）'; }
      else if (state.clips.length && !confirm('有新版本（' + m[1] + '）。更新後目前剪的內容會消失，確定要更新嗎？')) { st.textContent = '有新版本 ' + m[1] + '，你選擇先不更新'; }
      else { st.textContent = '找到新版本 ' + m[1] + '，更新中…'; try { sessionStorage.removeItem('ipsj-rl'); } catch (e) {} reloadNew(); }
    } catch (e) { st.style.color = '#ff6b6b'; st.textContent = '❌ 檢查失敗，請確認有連上網路'; }
    btn.disabled = false;
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('pageshow', check);
  check();
})();

  document.getElementById('q-music').addEventListener('click', () => { if (!L.length) return toast('請先按「＋素材」加入影片或照片'); pause(); ops.music(); });
